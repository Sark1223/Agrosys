<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: html_head}"></head>

<body>

    <div class="d-flex vh-100">
        <div th:replace="~{fragments :: sidebar}"></div>

        <main class="content-area p-4 w-100 bg-light">
            <header class="d-flex justify-content-between">
                <h1>Trabajadores</h1>
                <i class="ri-user-3-fill profile-icon"></i>
            </header>
            <div class="page-content">
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" th:classappend="${activeTab == 'usuarios'} ? 'active' : ''"
                            data-bs-toggle="tab" href="#usuarios" aria-selected="true" role="tab">Trabajadores actuales</a>
                    </li>
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" th:classappend="${activeTab == 'roles'} ? 'active' : ''"
                            data-bs-toggle="tab" href="#roles" aria-selected="false" role="tab" tabindex="-1">Asistencia</a>
                    </li>
                </ul>
                <div id="myTabContent" class="tab-content">
                    <div class="tab-pane fade" id="usuarios" role="tabpanel"
                        th:classappend="${activeTab == 'usuarios'} ? 'show active' : ''">
                        <div class="options p-2 d-flex justify-content-end flex-nowrap">
                            <button class="btn btn-primary" data-bs-toggle="modal"
                                data-bs-target="#modalAddUser">Agregar Trabajador</button>
                        </div>
                        <div class="cards d-flex flex-wrap flex-row g-2" id="cardsContainerUsers">
                            <!-- Se carga por JavaScript -->
                        </div>
                    </div>
                    <div class="tab-pane fade" id="roles" role="tabpanel"
                        th:classappend="${activeTab == 'roles'} ? 'show active' : ''">
                       
                        <div class="cards d-flex flex-wrap flex-row g-2" id="cardsContainerRoles">
                            <!-- Se carga por JavaScript -->
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <!-- USUARIOS -->
        <div class="modal fade" id="modalAddUser" tabindex="-1" aria-labelledby="modalAddUser" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Agregar Trabajador</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form method="post" th:action="@{/config/new-user}" id="addUserForm" class="needs-validation"
                            novalidate>
                            <div>
                                <label for="nombreInput" class="form-label mt-4">Nombre <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nombreInput" name="nombre" minlength="3"
                                    maxlength="100" placeholder="Ingrese el nombre del usuario" autocomplete="off"
                                    required>
                                <div class="invalid-feedback">El nombre es requerido</div>
                            </div>
                            <div>
                                <label for="apellidoInput" class="form-label mt-4">Notas <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="apellidoInput" name="apellido" minlength="3"
                                    maxlength="100" placeholder="Ingrese el apellido del usuario" autocomplete="off"
                                    required>
                                <div class="invalid-feedback">Las notas son requeridas</div>
                            </div>

                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-success" id="btn-submit-add-user">
                            Guardar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalEditUser" tabindex="-1" aria-labelledby="modalEditUser" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar Trabajador</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form method="post" th:action="@{/config/edit-user}" id="editUserForm" class="needs-validation"
                            novalidate>
                            <input type="number" id="userIdInputEdit" name="userId" hidden>
                            <div>
                                <label for="nombreInput" class="form-label mt-4">Nombre <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nombreInputEdit" name="nombre" minlength="3"
                                    maxlength="100" placeholder="Ingrese el nombre del usuario" autocomplete="off"
                                    required>
                                <div class="invalid-feedback">El nombre es requerido</div>
                            </div>
                            
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-success" id="btn-submit-edit-user">
                            Guardar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalDeleteUser" tabindex="-1" aria-labelledby="modalDeleteUser" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content border-danger text-white bg-dark">
                    <div class="modal-header border-danger">
                        <h5 class="modal-title">Eliminar Trabajador</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="textDelete">¿Está seguro de que desea eliminar al trabajador?</p>
                        <form method="post" th:action="@{/config/delete-user}" id="deleteUserForm"
                            class="needs-validation" novalidate>
                            <input type="number" id="userIdInputDelete" name="userId" hidden>
                        </form>
                    </div>
                    <div class="modal-footer border-danger fw-bolder">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="btn-submit-delete-user">
                            Eliminar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/js/workers/worker.js}"></script>
</body>

</html>
