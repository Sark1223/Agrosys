<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head}"></head>
<body>
    <div class="d-flex vh-100">
        <div th:replace="~{fragments :: sidebar}"></div>
        <main class="content-area p-4 w-100 bg-light">
            <header class="d-flex justify-content-between">
                <h1>Transacciones</h1>
                <i class="ri-user-3-fill profile-icon"></i>
            </header>
            <div class="page-content">
                <div class="options p-2 d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
                    <div class="row g-3 align-items-end w-100">
                        <div class="col-md-2">
                            <label class="fw-bold small">Fecha inicio <span class="text-danger">*</span></label>
                            <input type="date" id="filterStartDate" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label class="fw-bold small">Fecha fin <span class="text-danger">*</span></label>
                            <input type="date" id="filterEndDate" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label class="fw-bold small">Parcela</label>
                            <select id="filterPlot" class="form-select">
                                <option value="">Todas</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="fw-bold small">Tipo</label>
                            <select id="filterType" class="form-select">
                                <option value="">Todos</option>
                                <option value="INCOME">Ingreso</option>
                                <option value="EXPENSE">Egreso</option>
                                <option value="ADJUSTMENT">Ajuste</option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex gap-2">
                            <button class="btn btn-primary w-50" id="btnFilter">
                                <i class="ri-search-line"></i> Filtrar
                            </button>
                            <button class="btn btn-success w-50" data-bs-toggle="modal" data-bs-target="#modalAddTransaction">
                                <i class="ri-add-line"></i> Nueva
                            </button>
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Fecha</th>
                                <th>Tipo</th>
                                <th>Descripción</th>
                                <th>Parcela</th>
                                <th>Monto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyTransactions">
                            <tr>
                                <td colspan="7" class="text-center text-muted">
                                    Selecciona un rango de fechas y presiona Filtrar
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <!-- Modal Agregar/Editar -->
    <div class="modal fade" id="modalAddTransaction" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nueva Transacción</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="transactionForm">
                        <input type="hidden" id="transactionIdInput">
                        <div class="mb-3">
                            <label class="form-label">Tipo <span class="text-danger">*</span></label>
                            <select id="formType" class="form-select" required>
                                <option value="">Seleccione...</option>
                                <option value="INCOME">Ingreso</option>
                                <option value="EXPENSE">Egreso</option>
                                <option value="ADJUSTMENT">Ajuste</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha <span class="text-danger">*</span></label>
                            <input type="date" id="formDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Monto <span class="text-danger">*</span></label>
                            <input type="number" id="formAmount" class="form-control" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Parcela</label>
                            <select id="formPlot" class="form-select">
                                <option value="">Sin parcela</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <input type="text" id="formDescription" class="form-control" maxlength="256">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="btnSaveTransaction">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Eliminar -->
    <div class="modal fade" id="modalDeleteTransaction" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-danger text-white bg-dark">
                <div class="modal-header border-danger">
                    <h5 class="modal-title">Eliminar Transacción</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="deleteText">¿Está seguro de eliminar esta transacción?</p>
                </div>
                <div class="modal-footer border-danger">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmDelete">Eliminar</button>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/transactions/transactions.js}"></script>
</body>
</html>
