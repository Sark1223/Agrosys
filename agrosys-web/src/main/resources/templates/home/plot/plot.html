<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: html_head}"></head>

<body>

    <div class="d-flex vh-100 overflow-hidden">
        <div th:replace="~{fragments :: sidebar}"></div>

        <main class="content-area p-4 w-100 bg-light overflow-auto">
            <header class="d-flex justify-content-between">
                <h1>Parcelas</h1>
                <i class="ri-user-3-fill profile-icon"></i>
            </header>
            <div class="page-content">
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" th:classappend="${activeTab == 'plot'} ? 'active' : ''" data-bs-toggle="tab"
                            href="#plot" aria-selected="true" role="tab">Parcelas</a>
                    </li>
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" th:classappend="${activeTab == 'lot'} ? 'active' : ''" data-bs-toggle="tab"
                            href="#lot" aria-selected="false" role="tab" tabindex="-1">Lotes</a>
                    </li>
                </ul>
                <div id="myTabContent" class="tab-content">
                    <div class="tab-pane fade" id="plot" role="tabpanel"
                        th:classappend="${activeTab == 'plot'} ? 'show active' : ''">
                        <div class="options p-2 d-flex justify-content-end flex-nowrap">
                            <button class="btn btn-primary" data-bs-toggle="modal"
                                data-bs-target="#modalAddPlot">Agregar Parcela</button>
                        </div>
                        <div class="d-flex justify-content-center align-items-center text-body-tertiary fs-4 text"
                            style="height: 100px;" id="message-plot">Cargando información...</div>
                        <!-- <div class="cards d-flex flex-wrap flex-row g-2" id="cardsContainerPlot">
                        </div> -->
                        <div class="accordion p-2" id="accordionContainerPlots">
                            
                            <!-- Se carga por JavaScript -->
                            
                        </div>
                    </div>
                    <div class="tab-pane fade" id="lot" role="tabpanel"
                        th:classappend="${activeTab == 'lot'} ? 'show active' : ''">
                        <div class="options p-2 d-flex justify-content-end flex-nowrap">
                            <button class="btn btn-primary" data-bs-toggle="modal"
                                data-bs-target="#modalAddRole">Agregar Lote</button>
                        </div>
                        <div class="cards d-flex flex-wrap flex-row g-2" id="cardsContainerLot">
                            <!-- Se carga por JavaScript -->
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <!-- PARCELAS -->
        <div th:replace="~{home/plot/_modalsPlot :: plotModals}"></div>

        <!-- PLANTACIONES -->
        <div th:replace="~{home/plot/_modalsPlot :: plantationModals}"></div>

        <script th:src="@{/js/plot/plot.js}"></script>
</body>

</html>
