<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: html_head}"></head>

<body>
    <div class="d-flex vh-100">
        <div th:replace="~{fragments :: sidebar}"></div>

        <main class="content-area p-4 w-100 bg-light" th:if="${admin}">


            <header class="d-flex justify-content-between">
                <div>
                    <h1>Bienvenid@!</h1>
                    <p>Aquí tienes el estatus general. (:</p>
                </div>

                <i class="ri-user-3-fill profile-icon"></i>
            </header>

            <section class="dashboard-actions">
                <button id="btnRegistrarAsistencia" class="dashboard-btn btn-asistencia"
                    th:data-worker-id="${workerId}">
                    Registrar asistencia
                </button>

                <button id="btnRegistrarNuevoLote" class="dashboard-btn btn-lote"
                    th:if="${#lists.contains(modules, 'MODULE_PARCELAS')}" data-bs-toggle="modal"
                    data-bs-target="#modalAddLot">
                    Registrar nuevo lote
                </button>

                <button id="btnRegistrarNuevaTransaccion" class="dashboard-btn btn-transaccion"
                    th:if="${#lists.contains(modules, 'MODULE_FINANZAS')}">
                    Registrar nueva transaccion
                </button>

                <button id="btnVerSalarios" class="dashboard-btn btn-salarios"
                    th:if="${#lists.contains(modules, 'MODULE_FINANZAS')}">
                    Ver salarios
                </button>
            </section>

            <section class="dashboard-grid">

                <div id="cardFiltros" class="dashboard-card filtros-card">
                    <h3>FILTROS</h3>

                    <label for="filtroAnio">Seleccione año:</label>
                    <select id="filtroAnio"></select>

                    <label for="filtroMes">Seleccione mes:</label>
                    <select id="filtroMes"></select>

                    <label for="filtroDia">Seleccione día:</label>
                    <select id="filtroDia"></select>

                    <button id="btnAplicarFiltros" class="btn-aplicar">
                        Aplicar
                    </button>
                </div>

                <div id="cardIngresos" class="dashboard-card filtros-card">
                    <h3>INGRESOS</h3>
                </div>

                <div id="cardGastos" class="dashboard-card filtros-card">
                    <h3>GASTOS</h3>
                </div>

                <div id="cardClima" class="dashboard-card clima-card">
                    <h3>CLIMA</h3>
                    <div id="climaContenido" class="clima-contenido">
                        <p id="climaEstado">Cargando clima...</p>
                    </div>
                </div>

                <div id="cardInformeTareas" class="dashboard-card tareas-card">
                    <h3>INFORME DE TAREAS</h3>
                </div>

                <div id="cardIngresosVsGastos" class="dashboard-card grafica-card">
                    <h3>INGRESOS VS GASTOS</h3>
                </div>
            </section>
        </main>

        <main class="content-area p-4 w-100 bg-light" th:unless="${admin}">

            <header class="d-flex justify-content-between">
                <div>
                    <h1>Bienvenid@!</h1>
                    <p>Aquí tienes el estatus general. (:</p>
                </div>
                <i class="ri-user-3-fill profile-icon"></i>
            </header>

            <section class="dashboard-grid usuario-grid">

                <!-- Reloj -->
                <div id="cardReloj" class="dashboard-card reloj-card">
                    <div class="reloj-contenido">
                        <div class="reloj-horizontal">
                            <span id="relojHoras" class="reloj-numero-grande">00</span>
                            <span class="reloj-separador">:</span>
                            <span id="relojMinutos" class="reloj-numero-grande">00</span>
                            <span class="reloj-separador reloj-separador-chico">:</span>
                            <span id="relojSegundos" class="reloj-numero-chico">00</span>
                            <span id="relojAmPm" class="reloj-ampm">AM</span>
                        </div>
                    </div>
                </div>

                <!-- Clima -->
                <div id="cardClima" class="dashboard-card clima-card">
                    <h3>CLIMA</h3>
                    <div id="climaContenido" class="clima-contenido">
                        <p id="climaEstado">Cargando clima...</p>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <div th:if="${#lists.contains(modules, 'MODULE_PARCELAS')}">
        <div th:if="${admin}" th:replace="~{home/plot/_modalsPlot :: fLotModalAdd}"></div>

        <script th:src="@{/js/home/home.js}"></script>
        <script th:src="@{/js/plot/plantatio.js}"></script>
        <script th:src="@{/js/plot/lot.js}"></script>
    </div>

</body>

</html>
