# docker-compose.dev.yml
services:
  # === BASES DE DATOS ===
  mysql-auth:
    image: mysql:8.0
    container_name: agrosys-mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agrosys_auth
    ports:
      - "3307:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks:
      - agrosys-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  mysql-agrosys:
    image: mysql:8.0
    container_name: agrosys-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agrosys_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-agrosys-db-data:/var/lib/mysql
    networks:
      - agrosys-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # === MICROSERVICIOS EN MODO DESARROLLO ===
  agrosys-auth:
    build:
      context: ./agrosys-auth
      dockerfile: Dockerfile.dev  # Usamos Dockerfile de desarrollo
    container_name: agrosys-auth
    ports:
      - "8083:8083"
    volumes:
      # Bind mount del código fuente para hot reload
      - ./agrosys-auth/src:/app/src:delegated
      - ./agrosys-auth/pom.xml:/app/pom.xml
      # Opcional: montar el directorio de clases compiladas
      - ./agrosys-auth/target:/app/target
      - ./agrosys-auth/src/main/resources/db:/app/src/main/resources/db:delegated
    environment:
      DB_URL_AUTH: ${DB_URL_AUTH}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-auth:
        condition: service_healthy
    networks:
      - agrosys-network

  agrosys-gateway:
    build: ./agrosys-gateway
    container_name: agrosys-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://agrosys-auth:8083
      #JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - agrosys-auth
    networks:
      - agrosys-network

  agrosys-web:
    build:
      context: ./agrosys-web
      dockerfile: Dockerfile.dev  # Usamos Dockerfile de desarrollo
    container_name: agrosys-web
    ports:
      - "8081:8081"
    volumes:
      # Bind mount del código fuente para hot reload
      - ./agrosys-web/src:/app/src:delegated
      - ./agrosys-web/pom.xml:/app/pom.xml
      # Opcional: montar el directorio de clases compiladas
      - ./agrosys-web/target:/app/target
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_URL: ${GATEWAY_URL}
    networks:
      - agrosys-network

  agrosys-plot:
    build:
      context: ./agrosys-plot
      dockerfile: Dockerfile.dev  # Usamos Dockerfile de desarrollo
    container_name: agrosys-plot
    ports:
      - "8084:8084"
    volumes:
      # Bind mount del código fuente para hot reload
      - ./agrosys-plot/src:/app/src:delegated
      - ./agrosys-plot/pom.xml:/app/pom.xml
      # Opcional: montar el directorio de clases compiladas
      - ./agrosys-plot/target:/app/target
      - ./agrosys-plot/src/main/resources/db:/app/src/main/resources/db:delegated
  
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-agrosys:
        condition: service_healthy
    networks:
      - agrosys-network

networks:
  agrosys-network:
    driver: bridge

volumes:
  mysql-auth-data:
  mysql-agrosys-db-data: