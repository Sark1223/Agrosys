# Application Name
spring.application.name=agrosys-gateway

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Gateway Routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://agrosys-auth:8083
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**, /api/users/**, /api/roles/**

spring.cloud.gateway.server.webflux.routes[1].id=web-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://agrosys-web:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/agrosys/**

spring.cloud.gateway.server.webflux.routes[2].id=plot-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://agrosys-plot:8084
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/plot/**

spring.cloud.gateway.server.webflux.routes[3].id=worker-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://agrosys-worker:8085
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/worker/**

spring.cloud.gateway.server.webflux.routes[4].id=transaction-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://agrosys-transaction:8086
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/transaction/**

spring.cloud.gateway.server.webflux.routes[5].id=task-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://agrosys-task:8087
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/task/**
# Actuator endpoints - Configuración actualizada
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read_only

# Log
logging.level.com.agrosys.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - [%-5level] [%logger{36}.%M:%L] - %msg%n

