# Application Name
spring.application.name=agrosys-gateway

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Service URLs - Use the exact names from your Docker container list
services.auth=http://agrosys-auth:8083
services.web=http://agrosys-web:8081

# Gateway Routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://agrosys-auth:8083
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=web-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://agrosys-web:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/**

# Actuator endpoints - Configuración actualizada
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read_only

# Logging curl http://agrosys-auth:8083/actuator/health curl http://agrosys-web:8081/actuator/health
logging.level.com.agrosys.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - [%-5level] [%logger{36}.%M:%L] - %msg%n

